<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080808;color:#fff}
body{font-family:Arial,sans-serif;overflow:hidden}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#questionPage{background:radial-gradient(circle at 50% 35%,#252525 0,#0a0a0a 55%,#000 100%)}
.question-box{width:min(700px,94vw);padding:45px 25px;border:2px solid #333;border-radius:28px;background:#111;box-shadow:0 20px 60px #000}
.warning{font-size:42px;margin-bottom:18px}.question{font-family:"Permanent Marker",cursive;font-size:clamp(30px,7vw,58px);line-height:1.15;margin:0 auto 38px}
.buttons{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
button{font-family:"Bangers",cursive;letter-spacing:1.5px;font-size:28px;padding:15px 30px;border-radius:14px;cursor:pointer;background:#171717;color:#fff;border:3px solid #fff;box-shadow:6px 6px 0 #fff}
button:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #fff}.hint{margin-top:28px;color:#777;font-size:12px}
#prankPage{display:none;background:#000;position:relative;overflow:hidden}
#prankPage:before,#prankPage:after{content:"HAHA";position:absolute;font-family:"Bangers",cursive;font-size:140px;color:#111;z-index:0;transform:rotate(-20deg)}
#prankPage:before{left:-40px;top:22%}#prankPage:after{right:-40px;bottom:20%;transform:rotate(20deg)}
.prank-inner{position:relative;z-index:1}.skull{font-size:70px;animation:wiggle .45s infinite alternate}
.prank-title{font-family:"Bangers",cursive;font-size:clamp(90px,23vw,190px);letter-spacing:8px;line-height:.9;text-shadow:7px 7px 0 #222;margin:10px 0 25px}
.congrats{font-family:"Permanent Marker",cursive;font-size:clamp(28px,7vw,58px);margin:15px 0}
.message{font-family:"Permanent Marker",cursive;font-size:clamp(20px,5vw,34px);color:#ddd}
.box{display:inline-block;margin-top:30px;padding:22px 28px;border:3px dashed #555;border-radius:20px;font-family:"Permanent Marker",cursive;font-size:20px;max-width:650px}
.status{font-family:"Bangers",cursive;letter-spacing:2px;color:#777;font-size:22px;margin-top:25px}
@keyframes wiggle{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media(max-width:600px){.question-box{padding:35px 18px}.buttons{gap:14px}button{font-size:25px;padding:14px 23px}}
</style>
</head>
<body>
<section id="questionPage" class="page">
<div class="question-box">
<div class="warning">📱</div>
<h1 class="question">Are you currently using a phone?</h1>
<div class="buttons">
<button class="answer">YES, CONTINUE</button>
<button class="answer">NO, QUIT</button>
</div>
<div class="hint">Please select one option to continue.</div>
</div>
</section>

<section id="prankPage" class="page">
<div class="prank-inner">
<div class="skull">☠️🤣</div>
<div class="prank-title">PRANK</div>
<div class="congrats">CONGRATULATIONS! 🎉</div>
<div class="message">You got successfully pranked by <strong>SHAINIL</strong> 😂</div>
<div class="box">💀 You clicked it. You knew the risk. 🤣<br><br>There is absolutely nothing to see here.</div>
<div class="status">MISSION STATUS: SUCCESSFULLY PRANKED ✅</div>
</div>
</section>

<script>
const audio=new Audio("prank_voice.mp3");
audio.loop=true;
audio.preload="auto";
audio.volume=1;

function stopSound(){audio.pause();audio.currentTime=0;}

document.querySelectorAll(".answer").forEach(button=>{
button.addEventListener("click",async()=>{
document.getElementById("questionPage").style.display="none";
document.getElementById("prankPage").style.display="flex";
try{await audio.play();}catch(error){console.log("Browser blocked audio playback:",error);}
});
});

window.addEventListener("pagehide",stopSound);
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopSound();});
</script>
</body>
</html>
